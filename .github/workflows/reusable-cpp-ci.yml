name: 🇨 • CI

on:
  workflow_call:
    inputs:
      enable-coverage:
        description: "Whether to measure coverage and upload it to Codecov"
        default: true
        type: boolean
      fail-fast:
        description: "Whether to cancel the remaining test jobs when one fails"
        default: false
        type: boolean
      clang-version:
        description: "The major version of clang-tidy and clang-format to lint with"
        default: 18
        type: number
      cpp-linter-extra-args:
        description: "Additional arguments to pass to clang-tidy and clang-format"
        default: "-std=c++17"
        type: string
      cpp-linter-ignore-extra:
        description: "Additional paths (one per line) for the linter to ignore"
        default: ""
        type: string
      build-project:
        description: "Whether the linter needs the project configured to find its compile commands"
        default: false
        type: boolean
      setup-python:
        description: "Whether the linter needs Python (for projects with bindings)"
        default: false
        type: boolean
      install-pkgs:
        description: "Python packages the linter needs to resolve the bindings' headers"
        default: ""
        type: string
      additional-cpp-files:
        description: "Additional file patterns (one glob per line) whose changes require the linter and test jobs to run"
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

    # All optional, so that cross-organization callers (which cannot use
    # `secrets: inherit`) can pass them explicitly.
    secrets:
      IQM_TOKEN:
        required: false
      IQM_QC_ALIAS:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: 🚦 Gate
    uses: ./.github/workflows/reusable-change-detection.yml
    with:
      additional-cpp-files: ${{ inputs.additional-cpp-files }}

  setup:
    name: 🧮 Matrix
    # not `ubuntu-slim`: the minimal image does not ship a Python interpreter
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      test-matrix: ${{ steps.matrix.outputs.test }}
    steps:
      - name: Compute the test matrix
        id: matrix
        shell: python
        env:
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          import json, os

          # The platforms and their default compilers are ecosystem policy and
          # live here and nowhere else.
          PLATFORMS = {
              "linux": ("ubuntu-24.04", "gcc"),
              "linux-arm": ("ubuntu-24.04-arm", "gcc"),
              "macos": ("macos-26", "clang"),
              "windows": ("windows-2025", "msvc"),
              "windows-arm": ("windows-11-arm", "msvc"),
          }
          # Windows presets carry a suffix because the generator differs there.
          PRESET = lambda platform, config: (
              f"{config}-windows" if platform.startswith("windows") else config
          )
          # Release catches optimization-dependent bugs, debug catches assertions.
          # The arm runners are the scarce ones, so they only carry release.
          DEBUG_ON = ("linux", "macos", "windows")

          def entry(platform, config):
              runner, compiler = PLATFORMS[platform]
              return {"os": platform, "runs-on": runner, "compiler": compiler,
                      "config": config, "preset": PRESET(platform, config)}

          if os.environ["DRAFT"] == "true":
              # one cheap assertion-checking build is the whole draft signal
              test = [entry("linux", "debug")]
          else:
              test = [entry(p, "release") for p in PLATFORMS]
              test += [entry(p, "debug") for p in DEBUG_ON]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"test={json.dumps({'include': test})}\n")

  lint:
    name: Lint
    needs: gate
    if: ${{ fromJSON(needs.gate.outputs.run-cpp-linter) }}
    uses: ./.github/workflows/reusable-cpp-linter.yml
    with:
      clang-version: ${{ inputs.clang-version }}
      cpp-linter-extra-args: ${{ inputs.cpp-linter-extra-args }}
      cpp-linter-ignore-extra: ${{ inputs.cpp-linter-ignore-extra }}
      build-project: ${{ inputs.build-project }}
      setup-python: ${{ inputs.setup-python }}
      install-pkgs: ${{ inputs.install-pkgs }}
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}
      setup-mlir: ${{ inputs.setup-mlir }}
      llvm-version: ${{ inputs.llvm-version }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      pull-requests: write # Required to post review comments

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.config }})
    needs: [gate, setup]
    # the linter is deliberately not a dependency: it is slower than the fastest
    # test jobs and failing it should not delay their feedback
    if: >-
      ${{ !cancelled()
      && needs.setup.result == 'success'
      && fromJSON(needs.gate.outputs.run-cpp-tests) }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.setup.outputs.test-matrix) }}
    uses: ./.github/workflows/reusable-cpp-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      preset-name: ${{ matrix.preset }}
      # the matrix already decided what a draft runs, so nothing is filtered below
      run-on-draft: true
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}
      setup-mlir: ${{ inputs.setup-mlir }}
      llvm-version: ${{ inputs.llvm-version }}
      # only Windows needs a matching debug MLIR: mixing a debug build against a
      # release LLVM breaks on the MSVC debug runtime, but is fine elsewhere
      mlir-debug: ${{ startsWith(matrix.os, 'windows') && matrix.config == 'debug' }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  coverage:
    name: Coverage
    needs: [gate, test]
    # drafts run a single build and no coverage entry, so there is nothing to upload
    if: >-
      ${{ !cancelled()
      && needs.test.result == 'success'
      && inputs.enable-coverage
      && fromJSON(needs.gate.outputs.run-cpp-tests)
      && !github.event.pull_request.draft }}
    uses: ./.github/workflows/reusable-cpp-coverage.yml
    with:
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}
      setup-mlir: ${{ inputs.setup-mlir }}
      llvm-version: ${{ inputs.llvm-version }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Required for the `actions/checkout` action
      id-token: write # Required for the `codecov/codecov-action` action

  # the one job branch protection needs to require
  check:
    name: 🚦 Check
    needs: [gate, setup, lint, test, coverage]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
