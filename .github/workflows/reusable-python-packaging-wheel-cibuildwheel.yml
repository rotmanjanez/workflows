name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner image to test on"
        default: "ubuntu-24.04"
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

    # All optional, so that cross-organization callers (which cannot use
    # `secrets: inherit`) can pass them explicitly.
    secrets:
      IQM_TOKEN:
        required: false
      IQM_QC_ALIAS:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-packaging-cibw-${{ inputs.runs-on }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheel:
    name: 🎡 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 && !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir && !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true # setup-uv v10 no longer prunes by default
          cache-suffix: cibw
          enable-cache: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}

      # set up sccache for faster builds
      - name: Set up compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-wheels-${{ inputs.runs-on }}-${{ github.run_id }}
          restore-keys: sccache-wheels-${{ inputs.runs-on }}-

      - name: Set up MSVC
        if: ${{ startsWith(inputs.runs-on, 'windows') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsArch = switch ($env:RUNNER_ARCH) {
            'X64' { 'amd64' }
            'ARM64' { 'arm64' }
            default { throw "Unsupported Windows runner architecture: $env:RUNNER_ARCH" }
          }
          $component = switch ($env:RUNNER_ARCH) {
            'X64' { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
            'ARM64' { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' }
          }

          $candidates = @(
            if (${env:ProgramFiles(x86)}) {
              Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            }
            if ($env:ProgramFiles) {
              Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'
            }
            Get-Command vswhere.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          )
          $vswhere = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $vswhere) {
            throw 'vswhere.exe not found'
          }

          $vsPath = (& $vswhere -latest -products '*' -prerelease -requires $component -property installationPath | Select-Object -First 1)
          if (-not $vsPath) {
            throw "Visual Studio with $component not found"
          }
          $devShell = Join-Path $vsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path $devShell)) {
            throw "Developer shell not found: $devShell"
          }

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShellArguments = @{
            Arch = $vsArch
            SkipAutomaticLocation = $true
          }
          if ($env:RUNNER_ARCH -eq 'X64') {
            $devShellArguments.HostArch = 'amd64'
          }
          & $devShell @devShellArguments

          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { '\Hostarm64\arm64\' } else { '\Hostx64\x64\' }
          if ($compiler -notmatch [regex]::Escape($expected)) {
            throw "Unexpected MSVC compiler for $($env:RUNNER_ARCH): $compiler"
          }
          Write-Host "Using $compiler"

          Get-ChildItem Env: | ForEach-Object {
            if (
              (!$before.ContainsKey($_.Name) -or $before[$_.Name] -cne $_.Value) -and
              $_.Name -notmatch '^(GITHUB_|RUNNER_)' -and
              $_.Name -ne 'NODE_OPTIONS'
            ) {
              $delimiter = "ghadelimiter_$([guid]::NewGuid().ToString('N'))"
              Add-Content -Path $env:GITHUB_ENV -Value "$($_.Name)<<$delimiter" -Encoding utf8
              Add-Content -Path $env:GITHUB_ENV -Value $_.Value -Encoding utf8
              Add-Content -Path $env:GITHUB_ENV -Value $delimiter -Encoding utf8
            }
          }
      # cibuildwheel otherwise picks the Visual Studio generator, which ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER and so left sccache completely unused.
      - name: Build Windows with Ninja
        if: ${{ startsWith(inputs.runs-on, 'windows') }}
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Set up sccache
        if: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
        shell: bash
        run: |
          uv tool install sccache
          # Ninja is the generator on Windows, and cibuildwheel builds in an
          # isolated environment that would not otherwise provide it.
          uv tool install ninja
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
          } >> "$GITHUB_ENV"

      # A manylinux build runs inside a container, so an sccache installed there writes to a
      # directory that dies with the container: projects that install sccache in `before-all`
      # see it enabled by CMake and report a 0% hit rate on every single run. Bind-mounting a
      # host directory in gives the cache somewhere to survive, and the step above caches it.
      # `environment-pass` is used rather than `environment` because the latter would replace
      # the project's own `[tool.cibuildwheel.linux] environment` table -- which is typically
      # where MLIR_DIR and the like are set.
      - name: Set up sccache in the manylinux container
        if: ${{ startsWith(inputs.runs-on, 'ubuntu') }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sccache"
          {
            echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume=$RUNNER_TEMP/sccache:/host/sccache"
            echo "CIBW_ENVIRONMENT_PASS_LINUX=SCCACHE_DIR SCCACHE_CACHE_SIZE"
            echo "SCCACHE_DIR=/host/sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
          } >> "$GITHUB_ENV"

      # run cibuildwheel to build wheels for the specified Python version
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0

      # sccache flushes lazily, so the server must be stopped before the cache is saved.
      # cibuildwheel builds each interpreter in its own environment and the server may
      # already be gone by the time this runs (regularly the case on Windows), so a
      # failure here means there is nothing left to flush -- never that the job failed.
      - name: Show sccache stats and stop the server
        if: ${{ always() && !startsWith(inputs.runs-on, 'ubuntu') }}
        continue-on-error: true
        run: |
          sccache --show-stats || true
          sccache --stop-server || true
      # the container is gone by now, so the cache is only readable through the host mount
      - name: Make the container cache readable by the cache action
        if: ${{ always() && startsWith(inputs.runs-on, 'ubuntu') }}
        continue-on-error: true
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/sccache"
          du -sh "$RUNNER_TEMP/sccache"
      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      # upload the wheels as an artifact (adds a `dev-` prefix for PRs)
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse/*.whl
