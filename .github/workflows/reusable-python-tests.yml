name: 🐍 • Tests
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The platform to run the tests on"
        required: true
        type: string
      python-version:
        description: "The Python version to run the sessions for (e.g. '3.14'); empty lets the sessions pick"
        default: ""
        type: string
      sessions:
        description: "The Nox sessions to run for ready pull requests and non-pull-request events, formatted as a JSON array"
        default: '["minimums", "tests"]'
        type: string
      enable-coverage:
        description: "Whether to measure coverage and upload the report as an artifact"
        default: true
        type: boolean
      timeout-minutes:
        description: "The maximum time in minutes to allow the job to run before it is cancelled"
        default: 30
        type: number
      wheels-artifact:
        description: "The artifact holding built wheels for this platform (e.g. '[dev-]cibw-wheels-<runs-on>'); empty builds from source"
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

    # All optional, so that cross-organization callers (which cannot use
    # `secrets: inherit`) can pass them explicitly.
    secrets:
      IQM_TOKEN:
        required: false
      IQM_QC_ALIAS:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-tests-${{ inputs.runs-on }}${{ inputs.python-version && format('-{0}', inputs.python-version) || '' }}-${{ join(fromJSON(inputs.sessions), '-') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: 🐍 ${{ inputs.runs-on }}${{ inputs.python-version && format(' {0}', inputs.python-version) || '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      FORCE_COLOR: 3
      GITHUB_TOKEN: ${{ github.token }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true # setup-uv v10 no longer prunes by default
          # also exports `UV_PYTHON`, in sync with the `-p` the test step passes to nox
          python-version: ${{ inputs.python-version }}
          cache-suffix: ${{ inputs.python-version && format('{0}-', inputs.python-version) || '' }}${{ join(fromJSON(inputs.sessions), '-') }}

      - if: ${{ inputs.wheels-artifact != '' }}
        name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.wheels-artifact }}
          path: ${{ runner.temp }}/wheelhouse
      # `UV_FIND_LINKS` only adds a source; the version pin keeps a stale wheelhouse from falling through to PyPI
      - if: ${{ inputs.wheels-artifact != '' }}
        name: Install from the wheelhouse
        shell: bash
        run: |
          info=$(uv run --no-project --python 3.13 python -c 'import pathlib, re, sys, tomllib; p = tomllib.loads(pathlib.Path("pyproject.toml").read_text()).get("project", {}); name = p.get("name") or sys.exit("pyproject.toml has no [project].name"); c = re.sub(r"[-_.]+", "_", name).lower(); v = sorted({f.name.split("-")[1] for f in pathlib.Path(sys.argv[1]).glob("*.whl") if f.name.split("-")[0].lower() == c}); sys.exit(f"no {name} wheel in the wheelhouse: the artifact is empty or holds another project") if not v else None; sys.exit(f"the wheelhouse holds several {name} versions: {v}") if len(v) > 1 else None; print(name, v[0])' "$RUNNER_TEMP/wheelhouse")
          read -r name version <<< "$info"
          echo "Testing $name==$version from the wheelhouse"
          echo "$name==$version" > "$RUNNER_TEMP/wheelhouse-constraint.txt"
          {
            echo "UV_FIND_LINKS=$RUNNER_TEMP/wheelhouse"
            echo "UV_NO_BUILD_PACKAGE=$name"
            echo "UV_CONSTRAINT=$RUNNER_TEMP/wheelhouse-constraint.txt"
          } >> "$GITHUB_ENV"

      - name: 🐍 Test
        # `bash` is required so that the environment variables are expanded on Windows, too
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          SESSIONS: ${{ join(fromJSON(inputs.sessions), ' ') }}
          # not COVERAGE_FILE: coverage.py uses that for its own data file
          COVERAGE_REPORT: ${{ inputs.enable-coverage && format('coverage-{0}{1}-{2}.xml', inputs.runs-on, inputs.python-version && format('-{0}', inputs.python-version) || '', join(fromJSON(inputs.sessions), '-')) || '' }}
          NOX_DEFAULT_VENV_BACKEND: uv
        run: |
          set -- -s $SESSIONS
          if [ -n "$PYTHON_VERSION" ]; then
            # a missing interpreter must fail the job, not skip the session
            set -- "$@" -p "$PYTHON_VERSION" --error-on-missing-interpreters
          fi
          if [ "$RUNNER_DEBUG" = "1" ]; then
            set -- "$@" --verbose
          fi
          if [ -n "$COVERAGE_REPORT" ]; then
            set -- "$@" -- --cov --cov-report="xml:$COVERAGE_REPORT" --cov-append
          fi
          uvx nox "$@"

      # upload the report as an artifact to GitHub so that it can later be uploaded to Codecov
      - if: ${{ inputs.enable-coverage }}
        name: Upload 🐍 coverage report for ${{ inputs.runs-on }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ inputs.runs-on }}${{ inputs.python-version && format('-{0}', inputs.python-version) || '' }}-${{ join(fromJSON(inputs.sessions), '-') }}
          path: coverage-${{ inputs.runs-on }}${{ inputs.python-version && format('-{0}', inputs.python-version) || '' }}-${{ join(fromJSON(inputs.sessions), '-') }}.xml
          if-no-files-found: error
          archive: false
