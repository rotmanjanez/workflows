name: 🐍 • Tests
on:
  workflow_call:
    inputs:
      compiled:
        description: "Whether the project has a compiled extension; if so, tests install the built wheels"
        default: false
        type: boolean
      python-versions:
        description: "The Python versions to test, formatted as a JSON array, oldest first"
        default: '["3.11", "3.12", "3.13", "3.14"]'
        type: string
      enable-coverage:
        description: "Whether to measure coverage and upload it to Codecov"
        default: true
        type: boolean
      fail-fast:
        description: "Whether to cancel the remaining test jobs when one fails"
        default: false
        type: boolean
      timeout-minutes:
        description: "The maximum time in minutes to allow a single test job to run"
        default: 30
        type: number
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

    # All optional, so that cross-organization callers (which cannot use
    # `secrets: inherit`) can pass them explicitly.
    secrets:
      IQM_TOKEN:
        required: false
      IQM_QC_ALIAS:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: 🧮 Matrix
    # not `ubuntu-slim`: the minimal image does not ship a Python interpreter
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: python
        env:
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          ENABLE_COVERAGE: ${{ inputs.enable-coverage }}
        run: |
          import json, os

          RUNNERS = {
              "linux": "ubuntu-24.04",
              "linux-arm": "ubuntu-24.04-arm",
              "macos": "macos-26",
              "windows": "windows-2025",
              "windows-arm": "windows-11-arm",
          }

          versions = json.loads(os.environ["PYTHON_VERSIONS"])
          oldest, newest = versions[0], versions[-1]
          bounds = [oldest] if oldest == newest else [oldest, newest]
          coverage = os.environ["ENABLE_COVERAGE"] == "true"

          def entry(platform, version, session, cover=False):
              e = {"os": platform, "runs-on": RUNNERS[platform],
                   "python-version": version, "session": session}
              return e | {"coverage": True} if cover else e

          if os.environ["DRAFT"] == "true":
              matrix = [entry("linux", newest, "tests")]
          else:
              # only linux (x86) runs the full interpreter range
              matrix = [entry(p, v, "tests", cover=coverage and p == "linux" and v == newest)
                        for p in RUNNERS
                        for v in (versions if p == "linux" else bounds)]
              # a wrong lower bound already shows up on linux and windows (x86)
              matrix += [entry(p, v, "minimums") for p in ("linux", "windows") for v in bounds]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")

  test:
    name: 🐍 ${{ matrix.runs-on }} ${{ matrix.python-version }} ${{ matrix.session }}
    needs: setup
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      FORCE_COLOR: 3
      GITHUB_TOKEN: ${{ github.token }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      REPORT: ${{ matrix.coverage && format('coverage-{0}-{1}-{2}.xml', matrix.runs-on, matrix.python-version, matrix.session) || '' }}
      WHEELS: ${{ inputs.compiled && format('{0}cibw-wheels-{1}', github.event_name == 'pull_request' && 'dev-' || '', matrix.runs-on) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      # MLIR is a build dependency. When the wheelhouse is in use nothing is compiled here -- the
      # job installs a repaired wheel, which already carries its shared libraries -- so setting it
      # up costs 20-70s per job and buys nothing. It is still needed on the fallback path, where
      # the noxfile builds the project from source.
      - name: Set up MLIR
        if: ${{ inputs.setup-mlir && env.WHEELS == '' }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true # setup-uv v10 no longer prunes by default
          # also exports `UV_PYTHON`, in sync with the `-p` the test step passes to nox
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.session }}

      - if: ${{ env.WHEELS != '' }}
        name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.WHEELS }}
          path: ${{ runner.temp }}/wheelhouse
      # `UV_FIND_LINKS` only adds a source; the version pin keeps a stale wheelhouse from falling through to PyPI.
      #
      # `MQT_WHEELHOUSE` is the contract with the caller's noxfile, and it has to be honoured for any of this
      # to have an effect: `uv sync` always installs the root project from the local tree, and no environment
      # variable overrides that -- not `UV_NO_SOURCES`, not `UV_NO_BUILD_PACKAGE`. A noxfile that syncs the
      # project rebuilds it in every single test job no matter what is set here. When `MQT_WHEELHOUSE` is
      # present, the session must pass `--no-install-project` to `uv sync` and install the package separately,
      # at which point `UV_FIND_LINKS` and `UV_CONSTRAINT` resolve it to the wheel that was just built.
      # See `UPGRADING.md` for the noxfile side of this.
      - if: ${{ env.WHEELS != '' }}
        name: Install from the wheelhouse
        shell: bash
        run: |
          info=$(uv run --no-project --python 3.13 python -c 'import pathlib, re, sys, tomllib; p = tomllib.loads(pathlib.Path("pyproject.toml").read_text()).get("project", {}); name = p.get("name") or sys.exit("pyproject.toml has no [project].name"); c = re.sub(r"[-_.]+", "_", name).lower(); v = sorted({f.name.split("-")[1] for f in pathlib.Path(sys.argv[1]).glob("*.whl") if f.name.split("-")[0].lower() == c}); sys.exit(f"no {name} wheel in the wheelhouse: the artifact is empty or holds another project") if not v else None; sys.exit(f"the wheelhouse holds several {name} versions: {v}") if len(v) > 1 else None; print(name, v[0])' "$RUNNER_TEMP/wheelhouse")
          read -r name version <<< "$info"
          echo "Testing $name==$version from the wheelhouse"
          echo "$name==$version" > "$RUNNER_TEMP/wheelhouse-constraint.txt"
          {
            echo "MQT_WHEELHOUSE=$RUNNER_TEMP/wheelhouse"
            echo "UV_FIND_LINKS=$RUNNER_TEMP/wheelhouse"
            echo "UV_NO_BUILD_PACKAGE=$name"
            echo "UV_CONSTRAINT=$RUNNER_TEMP/wheelhouse-constraint.txt"
          } >> "$GITHUB_ENV"

      - name: 🐍 Test
        # `bash` is required so that the environment variables are expanded on Windows, too
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          SESSION: ${{ matrix.session }}
          NOX_DEFAULT_VENV_BACKEND: uv
        run: |
          # a missing interpreter must fail the job, not skip the session
          set -- -s "$SESSION" -p "$PYTHON_VERSION" --error-on-missing-interpreters
          if [ "$RUNNER_DEBUG" = "1" ]; then
            set -- "$@" --verbose
          fi
          if [ -n "$REPORT" ]; then
            set -- "$@" -- --cov --cov-report="xml:$REPORT" --cov-append
          fi
          uvx nox "$@"

      # upload the report as an artifact to GitHub so that it can later be uploaded to Codecov
      - if: ${{ env.REPORT != '' }}
        name: Upload 🐍 coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.runs-on }}-${{ matrix.python-version }}-${{ matrix.session }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          archive: false

  coverage:
    name: Coverage
    needs: test
    # drafts run no coverage entry, so there is no report to upload
    if: ${{ inputs.enable-coverage && !github.event.pull_request.draft }}
    uses: ./.github/workflows/reusable-python-coverage.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Required for the `actions/checkout` action
      id-token: write # Required for the `codecov/codecov-action` action
