name: 🇨 • Tests
on:
  workflow_call:
    inputs:
      enable-coverage:
        description: "Whether to measure coverage and upload it to Codecov"
        default: true
        type: boolean
      fail-fast:
        description: "Whether to cancel the remaining test jobs when one fails"
        default: false
        type: boolean
      compiler:
        description: >
          The compiler to use. Defaults to the platform's default compiler,
          that is, 'gcc' on Linux, 'clang' (Apple Clang) on macOS, and 'msvc' on Windows.
          Linux accepts 'gcc', 'clang', and 'clang-XX' (installed from apt.llvm.org).
          macOS accepts 'clang', 'clang-XX', and 'gcc-XX' (both installed from Homebrew).
          Windows accepts 'msvc' and 'clang' (which builds with clang-cl).
          XX is the major version number, for example 'clang-20' or 'gcc-14'.
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

    # All optional, so that cross-organization callers (which cannot use
    # `secrets: inherit`) can pass them explicitly.
    secrets:
      IQM_TOKEN:
        required: false
      IQM_QC_ALIAS:
        required: false
      AWS_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: 🧮 Matrix
    # not `ubuntu-slim`: the minimal image does not ship a Python interpreter
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: python
        env:
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          import json, os

          RUNNERS = {
              "linux": "ubuntu-24.04",
              "linux-arm": "ubuntu-24.04-arm",
              "macos": "macos-26",
              "windows": "windows-2025",
              "windows-arm": "windows-11-arm",
          }
          # release covers every platform, debug the three x86 ones
          DEBUG_ON = ("linux", "macos", "windows")

          def entry(platform, config):
              # only the Windows presets carry a suffix, because the generator differs
              suffix = "-windows" if platform.startswith("windows") else ""
              return {"os": platform, "runs-on": RUNNERS[platform],
                      "config": config, "preset": f"{config}{suffix}"}

          if os.environ["DRAFT"] == "true":
              matrix = [entry("linux", "debug")]
          else:
              matrix = ([entry(p, "release") for p in RUNNERS]
                        + [entry(p, "debug") for p in DEBUG_ON])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")

  cpp-tests:
    name: ${{ startsWith(matrix.runs-on, 'ubuntu') && '🐧' || startsWith(matrix.runs-on, 'macos') && '🍎' || '🏁' }} ${{ matrix.runs-on }} ${{ matrix.config }}
    needs: setup
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsArch = switch ($env:RUNNER_ARCH) {
            'X64' { 'amd64' }
            'ARM64' { 'arm64' }
            default { throw "Unsupported Windows runner architecture: $env:RUNNER_ARCH" }
          }
          $component = switch ($env:RUNNER_ARCH) {
            'X64' { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
            'ARM64' { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' }
          }

          $candidates = @(
            if (${env:ProgramFiles(x86)}) {
              Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            }
            if ($env:ProgramFiles) {
              Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'
            }
            Get-Command vswhere.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          )
          $vswhere = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $vswhere) {
            throw 'vswhere.exe not found'
          }

          $vsPath = (& $vswhere -latest -products '*' -prerelease -requires $component -property installationPath | Select-Object -First 1)
          if (-not $vsPath) {
            throw "Visual Studio with $component not found"
          }
          $devShell = Join-Path $vsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path $devShell)) {
            throw "Developer shell not found: $devShell"
          }

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShellArguments = @{
            Arch = $vsArch
            SkipAutomaticLocation = $true
          }
          if ($env:RUNNER_ARCH -eq 'X64') {
            $devShellArguments.HostArch = 'amd64'
          }
          & $devShell @devShellArguments

          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { '\Hostarm64\arm64\' } else { '\Hostx64\x64\' }
          if ($compiler -notmatch [regex]::Escape($expected)) {
            throw "Unexpected MSVC compiler for $($env:RUNNER_ARCH): $compiler"
          }
          Write-Host "Using $compiler"

          Get-ChildItem Env: | ForEach-Object {
            if (
              (!$before.ContainsKey($_.Name) -or $before[$_.Name] -cne $_.Value) -and
              $_.Name -notmatch '^(GITHUB_|RUNNER_)' -and
              $_.Name -ne 'NODE_OPTIONS'
            ) {
              $delimiter = "ghadelimiter_$([guid]::NewGuid().ToString('N'))"
              Add-Content -Path $env:GITHUB_ENV -Value "$($_.Name)<<$delimiter" -Encoding utf8
              Add-Content -Path $env:GITHUB_ENV -Value $_.Value -Encoding utf8
              Add-Content -Path $env:GITHUB_ENV -Value $delimiter -Encoding utf8
            }
          }

      # base-windows leaves the generator unset, so this picks Ninja without any
      # preset change. Ninja is what lets sccache act as a compiler launcher --
      # the Visual Studio generator ignores CMAKE_<LANG>_COMPILER_LAUNCHER.
      - name: Build Windows with Ninja
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # sccache cannot cache compilations that write a separate PDB, which is
          # what CMake asks for by default in Debug. Embedding the debug info in
          # the objects (/Z7) keeps every translation unit cacheable. Needs
          # CMP0141 to be NEW, so it is ignored by projects on an older policy.
          args="-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          # Keep the release CRT in Debug so the build links against the release
          # MLIR, like every other platform does. Needs CMP0091 to be NEW.
          args="$args -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"
          echo "CMAKE_CONFIGURE_ARGS=$args" >> "$GITHUB_ENV"

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Set up mold as linker
        if: ${{ runner.os == 'Linux' }}
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: false

      - name: Set up compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          # keyed per runner image, compiler, and preset, since objects cached by
          # one toolchain are useless to another
          key: sccache-cpp-tests-${{ matrix.runs-on }}-${{ inputs.compiler }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: sccache-cpp-tests-${{ matrix.runs-on }}-${{ inputs.compiler }}-${{ matrix.preset }}-

      - name: Use sccache as the compiler launcher
        run: |
          uv tool install sccache
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Install Ninja
        run: uv tool install ninja

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: |
          uv pip install lit
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LIT_BIN=$GITHUB_WORKSPACE/.venv/Scripts/lit.exe" >> "$GITHUB_ENV"
          else
            echo "LIT_BIN=$(which lit)" >> "$GITHUB_ENV"
          fi

      - name: Set up compiler
        env:
          COMPILER: ${{ inputs.compiler }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail

          # Strip anything that cannot appear in a compiler name before matching,
          # so the version can be interpolated into commands further down safely.
          compiler=$(echo "$COMPILER" | sed 's/[^a-zA-Z0-9.-]//g' | tr -d '\n')

          # An empty input means "whatever the platform provides by default".
          if [[ -z "$compiler" ]]; then
            case "$RUNNER_OS" in
              Linux) compiler=gcc ;;
              macOS) compiler=clang ;;
              Windows) compiler=msvc ;;
            esac
          fi

          fail() {
            echo "Invalid compiler '$compiler' for $RUNNER_OS." >&2
            exit 1
          }

          case "$RUNNER_OS" in
            Linux)
              case "$compiler" in
                gcc)
                  ;; # the default compiler; nothing to set up
                clang)
                  echo "CC=clang" >> "$GITHUB_ENV"
                  echo "CXX=clang++" >> "$GITHUB_ENV"
                  ;;
                clang-*)
                  version="${compiler#clang-}"
                  [[ "$version" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail
                  sudo apt-get update
                  wget https://apt.llvm.org/llvm.sh -O "$TEMP_DIR/llvm_install.sh"
                  chmod +x "$TEMP_DIR/llvm_install.sh"
                  sudo "$TEMP_DIR/llvm_install.sh" "$version"
                  sudo apt-get install -y "clang-$version" "clang-tools-$version"
                  echo "CC=clang-$version" >> "$GITHUB_ENV"
                  echo "CXX=clang++-$version" >> "$GITHUB_ENV"
                  ;;
                *) fail ;;
              esac
              ;;
            macOS)
              case "$compiler" in
                clang)
                  ;; # Apple Clang; nothing to set up
                clang-*)
                  version="${compiler#clang-}"
                  [[ "$version" =~ ^[0-9]+$ ]] || fail
                  brew install "llvm@$version"
                  echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
                  llvm_prefix=$(brew --prefix "llvm@$version")
                  echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
                  echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
                  # Link against Homebrew Clang's libc++ and unwind library to resolve symbol conflicts
                  echo "LDFLAGS=${LDFLAGS:-} -L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -lunwind" >> "$GITHUB_ENV"
                  ;;
                gcc-*)
                  version="${compiler#gcc-}"
                  [[ "$version" =~ ^[0-9]+$ ]] || fail
                  brew install "gcc@$version"
                  echo "CC=gcc-$version" >> "$GITHUB_ENV"
                  echo "CXX=g++-$version" >> "$GITHUB_ENV"
                  ;;
                *) fail ;;
              esac
              ;;
            Windows)
              case "$compiler" in
                msvc)
                  ;; # the default toolset; nothing to set up
                clang)
                  # Ninja takes no toolset, so name clang-cl as the compiler
                  # instead. It is the MSVC-compatible driver, so the MSVC
                  # environment set up above still applies.
                  echo "CC=clang-cl" >> "$GITHUB_ENV"
                  echo "CXX=clang-cl" >> "$GITHUB_ENV"
                  ;;
                *) fail ;;
              esac
              ;;
          esac

      - name: Configure CMake
        env:
          PRESET_NAME: ${{ matrix.preset }}
        run: |
          set -eo pipefail
          # unset off Windows, where there is nothing extra to pass
          read -r -a extra_args <<< "${CMAKE_CONFIGURE_ARGS:-}"
          cmake --preset "$PRESET_NAME" "${extra_args[@]}"

      - name: Build
        timeout-minutes: 60
        env:
          PRESET_NAME: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        env:
          PRESET_NAME: ${{ matrix.preset }}
        run: ctest --preset "$PRESET_NAME"

      # sccache flushes lazily, so the server must be stopped before the cache is
      # saved. A failure here means the server is already gone and there is
      # nothing left to flush -- never that the job failed.
      - name: Show sccache stats and stop the server
        if: ${{ always() }}
        continue-on-error: true
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

  coverage:
    name: Coverage
    needs: cpp-tests
    # drafts run a single build, and coverage is not worth their extra minutes
    if: ${{ inputs.enable-coverage && !github.event.pull_request.draft }}
    uses: ./.github/workflows/reusable-cpp-coverage.yml
    with:
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}
      setup-mlir: ${{ inputs.setup-mlir }}
      llvm-version: ${{ inputs.llvm-version }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Required for the `actions/checkout` action
      id-token: write # Required for the `codecov/codecov-action` action
